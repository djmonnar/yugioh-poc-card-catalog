<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원정 제작소로 이동</title><link rel="stylesheet" href="authoring039.css?v=20261026-039"></head><body><main class="au-loading"><h1>원정 제작소</h1><p>같은 DB를 사용하는 통합 제작 화면으로 이동합니다.</p><a href="index.html?section=relics">제작 화면 열기</a></main><script>
const from=new URL(location.href),to=new URL('index.html',location.href),panels=new Set(['cards','decks','chapters','starters','characters','relics','events','shop','packs','balance','recovery']);
let section='relics',hash=from.hash.slice(1);if(panels.has(hash))section=hash;if(hash==='settings')section='cards';if(from.searchParams.get('tab')==='events')section='events';if(from.searchParams.get('tab')==='shop')section='shop';to.searchParams.set('section',section);if(from.searchParams.has('deck'))to.searchParams.set('deck',from.searchParams.get('deck'));if(/^#card-\d+$/.test(from.hash))to.hash=from.hash;location.replace(to.pathname+to.search+to.hash);
