<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162c38"><title>스토리 제작 · Power of Chaos</title><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="style.css?v=20261006-8"><link rel="stylesheet" href="story.css?v=1"><script type="module" src="story.js?v=1"></script></head><body>
<header class="masthead"><a class="brand" href="./"><img src="assets/icon.svg" width="34" height="40" alt=""><span>POWER OF CHAOS<small>스토리 제작</small></span></a><a class="ai-builder-link" href="ai-decks.html">AI 덱 편집</a></header>
<main class="story-main"><p class="eyebrow">WRITE YOUR NEXT DUEL</p><h1>네가 만드는 다음 이야기.</h1><p>전투를 차례대로 배치하고, 상대와 보상을 골라줘. 편집본은 자동으로 이 브라우저에 저장돼.</p><p class="builder-notice">제작한 스토리는 적용용 자료로 내보낼 수 있어. 게임의 연속 진행·캐릭터 스킬·첫 보상 연결은 아직 준비 중이야. 현재 게임에는 용만과의 1회 전투가 연결돼 있어.</p>
<div class="story-toolbar"><button id="import">JSON 불러오기</button><button id="export">JSON 내보내기</button><button id="pack" class="primary">파이프라인 자료 받기</button><input type="file" id="import-file" accept="application/json,.json" hidden></div><p id="status" role="status">자료를 불러오는 중…</p>
<label>시나리오 이름<input id="story-title" maxlength="200"></label>
<div class="story-tabs" role="tablist"><button id="tab-battles" role="tab" aria-selected="true">전투 · 보상</button><button id="tab-actors" role="tab" aria-selected="false">캐릭터 · 스킬</button></div>
<section id="battles-panel"><div class="section-head"><h2>전투 순서</h2><button id="add-battle">+ 전투 추가</button></div><div id="battle-list"></div></section>
<section id="actors-panel" hidden><div class="section-head"><h2>전투 상대</h2><button id="add-actor">+ 캐릭터 추가</button></div><div id="actor-list"></div></section>
<aside id="validation" aria-live="polite"></aside></main>
<dialog id="card-picker"><div class="picker-head"><h2>카드 고르기</h2><button id="close-picker" aria-label="닫기">×</button></div><input id="card-search" type="search" placeholder="이름 · 종족 · 효과 검색" autocomplete="off"><p id="picker-purpose"></p><div id="picker-results"></div><div class="picker-pages"><button id="prev-cards">이전</button><span id="picker-page"></span><button id="next-cards">다음</button></div></dialog>
