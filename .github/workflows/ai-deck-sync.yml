name: Save AI deck
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
concurrency:
  group: ai-deck-online-save
  cancel-in-progress: false
jobs:
  save:
    if: github.event.issue.user.login == 'djmonnar' && github.event.sender.login == 'djmonnar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate owner save and update data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 mod-tools/ai-deck-sync/github_update.py
